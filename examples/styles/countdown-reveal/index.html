  $("#wraps").appendChild(wrap);
  heroes[r]={wrap,ent,C,E,H,pulse,
    spot:wrap.querySelector(".spot"),svg:ent.querySelector(".numsvg"),ns:ent.querySelector(".ns"),nf:ent.querySelector(".nf"),g1:ent.querySelector(".g1"),g2:ent.querySelector(".g2"),
    lab:ent.querySelector(".lab"),nm:ent.querySelector(".nm"),nms:ent.querySelector(".nm span"),floor:ent.querySelector(".floor"),sg:ent.querySelector(".sg"),v:ent.querySelector(".v")};
});

/* ---------------- recap wall ---------------- */
const TILEX=r=>120+((r-1)%5)*342, TILEY=r=>250+Math.floor((r-1)/5)*330;
const tiles={};
for(let r=1;r<=10;r++){
  const E=ENT[r],t=document.createElement("div");t.className="tile";t.style.left=TILEX(r)+"px";t.style.top=TILEY(r)+"px";
  t.innerHTML=`<div class="tr"${r===1?` style="color:${GOLD}"`:""}>SIRA ${String(r).padStart(2,"0")}</div><div class="tn">${E.n}<i>${E.q}</i></div><div class="ts">${fmt(E.v)}<small>MİLYON ADET</small></div>`;
  let C=null;
  if(r!==1){const w=document.createElement("div");w.className="cw";C=buildCard(E);w.appendChild(C.el);t.insertBefore(w,t.firstChild);C.el.style.left="0px";C.el.style.top="0px"}
  $("#tiles").appendChild(t);tiles[r]={el:t,C,E};
}

/* ---------------- rail ---------------- */
const rail=$("#rail"),railDots=[],railLabs=[];
for(let r=10;r>=1;r--){
  const d=document.createElement("div");d.className="rd";d.style.left="1720px";d.style.top=RAILY(r)+"px";rail.appendChild(d);railDots.push([r,d]);
  const l=document.createElement("div");l.className="rl";l.style.top=RAILY(r)+"px";l.textContent=String(r).padStart(2,"0");rail.appendChild(l);railLabs.push([r,l]);
}
const mk=document.createElement("div");mk.id="mk";rail.appendChild(mk);
$("#railline").style.cssText=`top:${RAILY(10)}px;height:${RAILY(1)-RAILY(10)}px;background:${SUP}`;
$("#railfill").style.cssText=`top:${RAILY(10)}px;height:0px;background:${rgba(INK,.5)}`;

/* static grain, seeded */
{const c=$("#grain"),g=c.getContext("2d"),im=g.createImageData(512,512),R=rng(7);for(let i=0;i<im.data.length;i+=4){const v=R()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}g.putImageData(im,0,0)}

/* curtain glow gradients (static) */
$("#curt").style.background=`linear-gradient(90deg,${rgba(GOLD,.55)},${rgba(GOLD,.3)} 14%,${rgba(GOLD,.3)} 86%,${rgba(GOLD,.55)})`;
$("#cl").style.cssText+=`;width:150px;background:linear-gradient(90deg,${rgba(GOLD,0)},${rgba(GOLD,.5)} 88%,${GOLD} 98%,#fff6d8 100%)`;
$("#cr").style.cssText+=`;width:150px;background:linear-gradient(270deg,${rgba(GOLD,0)},${rgba(GOLD,.5)} 88%,${GOLD} 98%,#fff6d8 100%)`;

/* ---------------- draw(t): every visible property is a function of t ---------------- */
function drawHero(r,t){
  const h=heroes[r],H=h.H,E=h.E;
  const isOne=r===1;
  const vis=isOne?(t>=CURT0):(r===3?t<H.out+H.outD+.05:(t<BLACK0+.02));
  h.wrap.style.visibility=vis?"visible":"hidden";
  if(!vis)return;
  const din=H.dolly?eio(seg(t,H.in,H.in+.9)):1;
  const xo=eio(seg(t,H.out,H.out+H.outD));
  const ao=isOne?1-eo3(seg(t,H.out,H.out+H.outD)):1-eo3(seg(t,H.out+H.outD*.35,H.out+H.outD));
  const off=f=>((1-din)*320-xo*320)*f;
  const cp=eo2(seg(t,H.cn[0],H.cn[1]));
  // push (2% over the hold) and the impact punch on number one
  let push=1+.02*seg(t,H.cd[1]-.2,H.out+H.outD);
  if(isOne){const m=eio(seg(t,MORPH0,MORPH1));const pn=.03*seg(t,IMP-.06,IMP)*(1-eo3(seg(t,IMP,IMP+.55)));push=(push+pn)*(1-m)+m}
  // camera push via zoom, not transform: Chrome re-lays out and re-rasters at the exact size every frame (no cached raster scale, so seeks stay pure)
  const pz=+push.toFixed(5);h.ent.style.zoom=pz;h.ent.style.left=(960*(1-pz)/pz).toFixed(3)+"px";h.ent.style.top=(540*(1-pz)/pz).toFixed(3)+"px";
  // spotlight
  h.spot.style.opacity=(eo3(seg(t,H.dr[0]-.3,H.dr[0]+.5))*ao).toFixed(3);
  h.spot.style.left=(520+Math.round(off(.35)+Math.sin(t*.8+r)*34))+"px";h.spot.style.top=(130+Math.round(Math.cos(t*.6+r)*12))+"px";
  // numeral: outline draws, then the fill rises with the count
  const sd=eio(seg(t,H.dr[0],H.dr[1]));
  h.ns.setAttribute("stroke-dashoffset",(1-sd).toFixed(4));
  h.ns.setAttribute("stroke",mix(SUP2,SUP,eo3(seg(t,H.dr[1],H.dr[1]+.5))));
  const go=(cp*404/404).toFixed(4);h.g1.setAttribute("offset",go);h.g2.setAttribute("offset",go);
  h.nf.setAttribute("fill-opacity",(cp>0?1-eo3(seg(t,H.out,H.out+.4)):0).toFixed(3));
  const drift=-60*eo3(seg(t,H.out,H.out+.6));
  h.svg.style.transform=`translateX(${(off(.75)+drift).toFixed(2)}px)`;
  h.svg.style.opacity=ao.toFixed(3);
  // label
  const la=eo3(seg(t,H.dr[0],H.dr[0]+.4))*ao;
  h.lab.style.opacity=la.toFixed(3);h.lab.style.transform=`translateX(${off(.9).toFixed(2)}px)`;
  h.lab.style.color=isOne?GOLD:SUP2;
  // name rising out of a mask
  const np=eo3(seg(t,H.nm[0],H.nm[1]));
  h.nms.style.transform=`translateY(${((1-np)*110).toFixed(2)}%)`;
  h.nm.style.transform=`translateX(${off(1.1).toFixed(2)}px)`;h.nm.style.opacity=ao.toFixed(3);
  // card: rises 40 px and tilts 8 -> 0, back.out(1.2)
  const cs=seg(t,H.cd[0],H.cd[1]),b=back(cs),ca=eo3(seg(t,H.cd[0],H.cd[0]+.35));
  const bob=Math.sin(t*1.7+r*2)*3*cs;
  if(isOne&&t>=MORPH0){
    const m=eio(seg(t,MORPH0,MORPH1)),s=1+(.4333-1)*m;
    const dx=(TILEX(1)-760)*m,dy=(TILEY(1)-260)*m;
    h.C.el.style.transformOrigin="0 0";
    h.C.el.style.transform=`translate(${dx.toFixed(2)}px,${dy.toFixed(2)}px) scale(${s.toFixed(5)})`;
    h.C.el.style.opacity=1;
  }else{
    h.C.el.style.transformOrigin="0 100%";
    h.C.el.style.transform=`translate(${Math.round(off(1))}px,${Math.round((1-b)*40+bob)}px) rotate(${((1-b)*8).toFixed(3)}deg)`;
    h.C.el.style.opacity=(ca*ao).toFixed(3);
  }
  setCard(h.C,cp,t);
  // floor reflection tint
  const fa=ca*ao*(isOne?1-eo3(seg(t,MORPH0,MORPH0+.4)):1);
  h.floor.style.opacity=fa.toFixed(3);h.floor.style.transform=`translateX(${off(1).toFixed(2)}px)`;
  // stat block
  const sa=eo3(seg(t,H.cn[0]-.25,H.cn[0]+.2))*ao;
  h.sg.style.opacity=sa.toFixed(3);h.sg.style.transform=`translateX(${off(1.15).toFixed(2)}px)`;
  h.v.textContent=fmt(E.v*cp);
  // impact ring on number one
  if(h.pulse){
    const pp=eo3(seg(t,IMP,IMP+.7)),g=pp*46;
    h.pulse.style.left=(760-g)+"px";h.pulse.style.top=(260-g)+"px";h.pulse.style.width=(720+2*g)+"px";h.pulse.style.height=(440+2*g)+"px";
    h.pulse.style.opacity=(t>=IMP&&t<IMP+.7?(1-pp)*.8:0).toFixed(3);
  }
}

function draw(t){
  [3,2,1].forEach(r=>drawHero(r,t));

  // curtain: black beat, hairline riser, centre-out light curtain
  const p=eio(seg(t,CURT0,CURT1)),half=960*p;
  const w1=heroes[1].wrap;
  w1.style.clipPath=p>=1?"none":`inset(0px ${(960-half).toFixed(2)}px)`;
  const hair=$("#hair");
  const hs=eo3(seg(t,4.25,CURT0));
  hair.style.transform=`scaleY(${hs.toFixed(4)})`;hair.style.opacity=(t<CURT0?hs:0).toFixed(3);
  const curt=$("#curt");
  curt.style.left=(960-half)+"px";curt.style.width=(2*half)+"px";
  curt.style.opacity=(t>=CURT0&&t<CURT1+.02?1-seg(p,.25,1):0).toFixed(3);
  const ea=(t>=CURT0&&t<CURT1+.02?seg(t,CURT0,CURT0+.06)*(1-seg(p,.88,1)):0).toFixed(3);
  $("#cl").style.left=(960-half-146)+"px";$("#cl").style.opacity=ea;
  $("#cr").style.left=(960+half-4)+"px";$("#cr").style.opacity=ea;

  // rail marker: 3 -> 2 with the dolly, 2 -> 1 during the black beat
  const rk=3-eio(seg(t,.15,1.05))-eio(seg(t,BLACK0,5.0));
  const my=Math.round(240+(10-rk)*(600/9));
  const mcol=mix(mixA(ENT[3].c,ENT[2].c,eio(seg(t,.15,1.05))),GOLD,eio(seg(t,BLACK0,5.0)));
  const mkEl=$("#mk");mkEl.style.top=my+"px";mkEl.style.background=mcol;
  $("#railfill").style.height=Math.max(0,my-RAILY(10))+"px";
  railDots.forEach(([r,d])=>{const k=clamp((my-RAILY(r))/14+.5);d.style.background=mix(SUP,"#B9B7B1",k)});
  railLabs.forEach(([r,l])=>{const k=clamp((my-RAILY(r))/14+.5);l.style.color=mix("#4B505B",r===Math.round(rk)?INK:SUP2,k*.9+.1*(r===Math.round(rk)?1:0))});
  const ra=1-eo3(seg(t,8.4,8.9));
  rail.style.opacity=ra.toFixed(3);
  const ka=1-eo3(seg(t,8.5,8.9));
  $("#kicker").style.opacity=ka.toFixed(3);$("#tag").style.opacity=ka.toFixed(3);

  // recap wall
  const rc=$("#recap");
  rc.style.visibility=t>=MORPH0+.2?"visible":"hidden";
  const hp=eo3(seg(t,8.9,9.5));
  $("#rh span").style.transform=`translateY(${((1-hp)*110).toFixed(2)}%)`;
  $("#rsub").style.opacity=eo3(seg(t,9.1,9.6)).toFixed(3);
  $("#rsrc").style.opacity=eo3(seg(t,9.4,9.9)).toFixed(3);
  for(let r=1;r<=10;r++){
    const T=tiles[r],s0=r===1?9.3:9.3+(r-2)*.06;
    const b=back(seg(t,s0,s0+.5)),a=eo3(seg(t,s0,s0+.35));
    if(r===1){
      T.el.style.opacity=a.toFixed(3);T.el.style.transform=`translateY(${((1-b)*16).toFixed(2)}px)`;
      // card of tile 1 is the morphed hero card; hide this tile's own card slot
    }else{
      T.el.style.opacity=a.toFixed(3);
      T.el.style.transform=`translateY(${((1-b)*44).toFixed(2)}px) scale(${(.9+.1*b).toFixed(4)})`;
      setCard(T.C,1,t);
    }
  }
  // soft sheen pass over the wall, then it keeps the final frame alive
  const sh=eio(seg(t,10.0,10.98));
  $("#sheen").style.left=Math.round(-640+sh*2640)+"px";
  $("#sheen").style.opacity=(t>=10.0&&t<10.99?1:0);
}

/* ---------------- HyperFrames contract: one paused timeline ---------------- */
const proxy={t:0};
const tl=gsap.timeline({paused:true});
tl.to(proxy,{t:DUR,duration:DUR,ease:"none",onUpdate:()=>draw(proxy.t)},0);
window.__timelines=window.__timelines||{};window.__timelines.main=tl;
window.DUR=DUR;
window.__seek=t=>{tl.seek(t,false);proxy.t=t;draw(t)};
document.fonts.ready.then(()=>{draw(0);window.READY=true});
})();
</script>
